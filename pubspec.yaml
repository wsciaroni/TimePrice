name: time_price
description: "A Flutter application for converting monetary prices to exact working time breakdown based on income and deductions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7
  flutter: '>=3.38.0'

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.16.0
  intl: ^0.20.3
  provider: ^6.1.5
  shared_preferences: ^2.5.5

dev_dependencies:
  coverage: ^1.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
