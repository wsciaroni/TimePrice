name: CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ci:
    name: Flutter Build, Analyze, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for SonarCloud blame and PR analysis

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # - name: Static Code Analysis
      #   run: flutter analyze

      - name: Run Tests & Generate Coverage
        run: flutter test --coverage

      - name: Build Application
        run: flutter build apk --debug

      - name: Verify Coverage Report Exists
        run: |
          echo "--- Coverage file check ---"
          ls -la coverage/
          head -5 coverage/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          args: >
            -X
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
