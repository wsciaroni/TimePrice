# SonarCloud Project Identification
sonar.projectKey=wsciaroni_TimePrice
sonar.organization=wsciaroni

# Project Metadata
sonar.projectName=TimePrice
sonar.projectVersion=1.0.0

# Encoding
sonar.sourceEncoding=UTF-8

# Source and Test Locations
sonar.sources=lib
sonar.tests=test

# Test Coverage Paths (LCOV format)
sonar.coverage.lcov.reportPaths=coverage/lcov.info
sonar.dart.coverage.reportPaths=coverage/lcov.info
sonar.dart.coverage.reportPath=coverage/lcov.info
sonar.flutter.coverage.reportPaths=coverage/lcov.info
sonar.flutter.coverage.reportPath=coverage/lcov.info

# Code Exclusions (Generated files, build outputs)
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated/**,build/**,.dart_tool/**
